<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREA 51 TACTICAL</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1117; 
            color: #58a6ff; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        h1 { 
            color: #3fb950; 
            font-family: monospace; 
            font-size: 28px; 
            margin-bottom: 4px;
        }
        .sub { 
            color: #8b949e; 
            font-size: 12px; 
            letter-spacing: 1.5px; 
            margin-bottom: 25px; 
        }
        .card { 
            background: #161b22; 
            border-radius: 12px; 
            padding: 24px; 
            max-width: 420px; 
            margin: 0 auto; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #c9d1d9; 
            font-weight: 600; 
            font-size: 14px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #3fb950; 
            font-family: monospace;
            font-size: 18px; 
            text-align: center; 
            margin-bottom: 20px; 
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        .btn { 
            display: block; 
            width: 100%; 
            background: #238636; 
            color: #ffffff; 
            border: none; 
            padding: 16px 0; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            margin: 12px 0; 
            text-decoration: none; 
            transition: background 0.2s;
        }
        .btn:hover { background: #2ea043; }
        .btn-blue { background: #1f6feb; }
        .btn-blue:hover { background: #388bfd; }
        .note {
            font-size: 12px;
            color: #8b949e;
            margin-top: 15px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>AREA 51 TACTICAL</h1>
    <div class="sub">DIRECT CAMERA HANDSHAKE PROTOCOL</div>

    <div class="card">
        <label for="cameraIp">Target Camera IP Address:</label>
        <input type="text" id="cameraIp" value="192.168.1.1" placeholder="192.168.1.1">

        <!-- Direct browser navigation triggers (Bypasses HTTPS mixed content restrictions) -->
        <button class="btn" onclick="openLogin()">LAUNCH CAMERA LOGIN</button>
        <button class="btn btn-blue" onclick="openMediaDir()">OPEN SD CARD DIRECTORY</button>

        <div class="note">
            <strong>Usage:</strong> Connect your phone to the camera's local Wi-Fi access point (e.g., <i>TrailCam_XXXX</i>), then tap <b>LAUNCH CAMERA LOGIN</b> to jump directly into the hardware control portal.
        </div>
    </div>

    <script>
        function getTargetIp() {
            let rawIp = document.getElementById('cameraIp').value.trim();
            // Clean up protocol prefixes or trailing slashes if pasted in by mistake
            let cleanIp = rawIp.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            return cleanIp || '192.168.1.1';
        }

        function openLogin() {
            const ip = getTargetIp();
            // Force direct browser navigation to switch from HTTPS to local HTTP
            window.location.href = `http://${ip}/`;
        }

        function openMediaDir() {
            const ip = getTargetIp();
            // Navigates directly to standard HTTP local file root
            window.location.href = `http://${ip}/sd/`;
        }
    </script>

</body>
</html>
