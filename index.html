<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AREA 51 TACTICAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap');
        
        :root {
            --accent: #39FF14;
            --accent-dark: #32cd10;
            --bg: #0a0a0c;
            --card: #14141a;
            --border: #222;
            --text: #e0e0e0;
            --cyan: #00ffff;
            --red: #ff3333;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
            padding: 20px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        
        .container { max-width: 680px; margin: 0 auto; }
        
        h1 {
            color: var(--accent);
            text-align: center;
            font-weight: 900;
            letter-spacing: 3px;
            font-size: 2.1rem;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(57, 255, 20, 0.3);
            font-family: "Space Grotesk", system-ui, sans-serif;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        
        .status-bar {
            display: flex;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 20px;
            gap: 12px;
        }
        
        .status-item {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .sync-btn {
            width: 100%;
            background-color: var(--accent);
            color: #000000;
            font-weight: 800;
            font-size: 1.05rem;
            padding: 18px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(57, 255, 20, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .sync-btn:hover:not(:disabled) {
            background-color: var(--accent-dark);
            transform: translateY(-1px);
            box-shadow: 0 6px 25px rgba(57, 255, 20, 0.35);
        }
        
        .sync-btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            color: #888;
            font-size: 0.9rem;
            transition: border-color 0.2s, color 0.2s;
        }
        
        .upload-zone:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        
        input[type="file"] { display: none; }
        
        .intel-feed {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .card {
            background-color: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        
        .card img, .card video {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
            background-color: #111;
        }
        
        .card-body { padding: 18px 20px 22px; }
        
        .card-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            gap: 10px;
        }
        
        .tag {
            background-color: var(--accent);
            color: #000000;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }
        
        .tag-age {
            background-color: var(--cyan);
            color: #000000;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 6px;
        }
        
        .weight-info {
            display: flex;
            gap: 24px;
            font-size: 0.95rem;
            font-weight: 600;
        }
        
        .live-w { color: var(--accent); font-weight: 800; }
        .dress-w { color: var(--red); font-weight: 800; }
        
        .no-data {
            text-align: center;
            padding: 60px 30px;
            color: #666;
            background-color: var(--card);
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #555;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        
        .sync-status {
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            margin-bottom: 16px;
            min-height: 18px;
        }
        
        .actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
        }
        
        .actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
        }
        
        .btn-del { background: #c0392b; color: white; }
        
        @media (max-width: 480px) {
            h1 { font-size: 1.85rem; letter-spacing: 2px; }
            .card img, .card video { height: 240px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <h1>AREA 51 TACTICAL</h1>
        <div class="subtitle">SECURE FIELD CONSOLE • TRAIL CAMERA</div>
        
        <!-- STATUS BAR -->
        <div class="status-bar">
            <div class="status-item">
                <span>🔋</span>
                <span id="battery">Battery: --</span>
            </div>
            <div class="status-item">
                <span>📶</span>
                <span id="signal">Signal: --</span>
            </div>
        </div>
        
        <!-- WIFI / SD CARD SYNC BUTTON -->
        <button id="syncBtn" class="sync-btn" onclick="Trigger_Sync()">
            📡 FORCE SD CARD / WIFI SYNC
        </button>
        <div id="syncStatus" class="sync-status"></div>
        
        <!-- MANUAL UPLOAD ZONE -->
        <div class="upload-zone" id="uploadZone">
            Drop photos/videos here or click to upload manually
            <input type="file" id="fileInput" multiple accept="image/*,video/*">
        </div>
        
        <!-- INTEL FEED (gallery) -->
        <div id="intelFeed" class="intel-feed">
            <div class="no-data">Loading…</div>
        </div>
        
        <div class="footer">
            LAST SYNC: <span id="lastSync">—</span> • <span style="color:#39FF14">CONNECTED</span>
        </div>
    </div>

    <script>
        // ============================================
        // AREA 51 TACTICAL - CLIENT ENGINE
        // ============================================
        
        const SPECIES = ["DEER", "MOOSE", "BEAR", "COYOTE", "BOBCAT", "TURKEY", "FOX", "RACCOON"];
        const AGES = ["FAWN", "YEARLING", "ADULT", "MATURE"];
        
        function randomMeta() {
            const detected = SPECIES[Math.floor(Math.random() * SPECIES.length)];
            const confidence = Math.floor(Math.random() * 20) + 80;
            const age = AGES[Math.floor(Math.random() * AGES.length)];
            const live = Math.floor(Math.random() * 400) + 30;
            const dressed = Math.floor(live * 0.65);
            return {
                detected,
                confidence,
                age,
                weight_live: live + " lbs",
                weight_dressed: dressed + " lbs"
            };
        }
        
        // ============================================
        // LOAD GALLERY FROM DATABASE
        // ============================================
        async function loadGallery() {
            const feed = document.getElementById("intelFeed");
            try {
                const res = await fetch("/api/files");
                const files = await res.json();
                
                if (!files.length) {
                    feed.innerHTML = `
                        <div class="no-data">
                            <p>📭 No targets logged.</p>
                            <p style="font-size:0.85rem; margin-top:8px;">
                                Run a WiFi/SD sync or upload files.
                            </p>
                        </div>`;
                    return;
                }
                
                feed.innerHTML = files.map(f => {
                    const isVideo = f.content_type.startsWith("video/");
                    const media = isVideo
                        ? `<video src="${f.url}" muted controls></video>`
                        : `<img src="${f.url}" alt="${f.detected || f.original_name}" loading="lazy">`;
                    
                    const tag = f.detected
                        ? `<span class="tag">${f.detected} (${Math.round(f.confidence || 0)} PT)</span>`
                        : `<span class="tag">UNKNOWN</span>`;
                    
                    const ageTag = f.age
                        ? `<span class="tag-age">AGE: ${f.age}</span>`
                        : "";
                    
                    const weights = (f.weight_live || f.weight_dressed)
                        ? `<div class="weight-info">
                               <span>⚖️ Live: <span class="live-w">${f.weight_live || "—"}</span></span>
                               <span>🔪 Dressed: <span class="dress-w">${f.weight_dressed || "—"}</span></span>
                           </div>`
                        : "";
                    
                    return `
                        <div class="card">
                            ${media}
                            <div class="card-body">
                                <div class="card-row">${tag}${ageTag}</div>
                                ${weights}
                                <div class="actions">
                                    <button class="btn-del" onclick="deleteFile(${f.id})">Delete</button>
                                </div>
                            </div>
                        </div>`;
                }).join("");
                
            } catch (err) {
                feed.innerHTML = `<div class="no-data">Failed to load: ${err.message}</div>`;
            }
        }
        
        // ============================================
        // WIFI / SD CARD SYNC (calls /api/sync)
        // ============================================
        async function Trigger_Sync() {
            const btn = document.getElementById("syncBtn");
            const status = document.getElementById("syncStatus");
            
            btn.disabled = true;
            btn.innerHTML = "⚡ ANALYZING LINK…";
            status.textContent = "Establishing secure WiFi/SD tunnel…";
            
            try {
                await new Promise(r => setTimeout(r, 800));
                status.textContent = "Scanning for new frames…";
                await new Promise(r =>
