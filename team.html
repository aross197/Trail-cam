<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AREA 51 TACTICAL – Team</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap');
    :root {
      --accent: #39FF14;
      --bg: #0a0a0c;
      --card: #14141a;
      --border: #222;
      --text: #e0e0e0;
      --cyan: #00ffff;
      --red: #ff3333;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif;
      padding: 12px;
      padding-bottom: 70px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    h1 {
      color: var(--accent);
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.35rem;
    }
    .user-label { font-size: 0.85rem; color: #888; }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
    }
    .tab {
      flex: 1;
      min-width: 70px;
      padding: 10px 6px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      text-align: center;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .btn {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-weight: 800;
      padding: 12px;
      border: none;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    .btn-secondary { background: #2d3436; color: var(--text); }
    .btn-danger { background: var(--red); color: #fff; }
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: #888;
      min-height: 18px;
      margin-bottom: 8px;
    }
    /* Gallery */
    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card img, .card video {
      width: 100%;
      height: 130px;
      object-fit: cover;
      background: #111;
    }
    .card-body { padding: 8px; font-size: 0.75rem; }
    .tag {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 3px;
    }
    .empty {
      text-align: center;
      color: #666;
      padding: 30px 10px;
      grid-column: 1 / -1;
    }
    /* Chat */
    .chat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      height: 320px;
      overflow-y: auto;
      padding: 12px;
      margin-bottom: 10px;
    }
    .msg {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      max-width: 85%;
      font-size: 0.9rem;
    }
    .msg.me {
      background: #1a3a1a;
      margin-left: auto;
      border: 1px solid #2a5a2a;
    }
    .msg.other {
      background: #1a1d27;
      border: 1px solid var(--border);
    }
    .msg .who {
      font-size: 0.7rem;
      color: var(--accent);
      margin-bottom: 2px;
      font-weight: 700;
    }
    .msg .time {
      font-size: 0.65rem;
      color: #666;
      margin-top: 3px;
    }
    .chat-input {
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      background: #0f1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .chat-input button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0 16px;
      font-weight: 800;
    }
    /* Compare */
    .compare-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .compare-row img, .compare-row video {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      background: #111;
    }
    select {
      width: 100%;
      background: #0f1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }
    /* Graphs */
    .chart-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
    }
    .chart-wrap h3 {
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 8px;
    }
    /* Map */
    #map {
      height: 320px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .loc-form input {
      width: 100%;
      background: #0f1117;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px;
      gap: 6px;
    }
    .bottom-nav a {
      flex: 1;
      text-align: center;
      color: #888;
      text-decoration: none;
      font-size: 0.7rem;
      padding: 6px 2px;
    }
    .bottom-nav a span { display: block; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="top">
    <h1>AREA 51</h1>
    <div class="user-label" id="username">—</div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('gallery')">Gallery</div>
    <div class="tab" onclick="showTab('chat')">Chat</div>
    <div class="tab" onclick="showTab('compare')">Compare</div>
    <div class="tab" onclick="showTab('graphs')">Graphs</div>
    <div class="tab" onclick="showTab('map')">Satellite</div>
  </div>

  <div class="status" id="status"></div>

  <!-- GALLERY -->
  <div id="gallery" class="panel active">
    <button class="btn" onclick="doSync()">📡 SYNC</button>
    <button class="btn btn-secondary" onclick="document.getElementById('fileInput').click()">📤 Upload</button>
    <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none" onchange="doUpload(this.files)">
    <div class="gallery" id="galleryGrid"><div class="empty">Loading…</div></div>
  </div>

  <!-- CHAT -->
  <div id="chat" class="panel">
    <div class="chat-box" id="chatBox"></div>
    <div class="chat-input">
      <input type="text" id="chatMsg" placeholder="Message the team…" onkeydown="if(event.key==='Enter')sendChat()">
      <button onclick="sendChat()">Send</button>
    </div>
  </div>

  <!-- COMPARE -->
  <div id="compare" class="panel">
    <label style="font-size:0.8rem;color:#888;">Left image</label>
    <select id="cmpLeft"></select>
    <label style="font-size:0.8rem;color:#888;">Right image</label>
    <select id="cmpRight"></select>
    <button class="btn" onclick="runCompare()">Compare Side-by-Side</button>
    <div class="compare-row" id="compareResult"></div>
  </div>

  <!-- GRAPHS -->
  <div id="graphs" class="panel">
    <div class="chart-wrap">
      <h3>Activity Over Time</h3>
      <canvas id="activityChart" height="180"></canvas>
    </div>
    <div class="chart-wrap">
      <h3>Species Detected</h3>
      <canvas id="speciesChart" height="180"></canvas>
    </div>
    <div class="chart-wrap">
      <h3>Uploads by User</h3>
      <canvas id="userChart" height="180"></canvas>
    </div>
  </div>

  <!-- SATELLITE / MAP -->
  <div id="map" class="panel">
    <div id="map" style="height:320px;border-radius:12px;margin-bottom:12px;"></div>
    <div class="loc-form">
      <input type="text" id="locName" placeholder="Camera name (e.g. North Ridge)">
      <input type="number" step="any" id="locLat" placeholder="Latitude">
      <input type="number" step="any" id="locLng" placeholder="Longitude">
      <input type="text" id="locDesc" placeholder="Description (optional)">
      <button class="btn" onclick="addLocation()">📍 Add Camera Location</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="/team"><span>🏠</span>Team</a>
    <a href="/app"><span>📁</span>My Files</a>
    <a href="setup.html"><span>📷</span>Setup</a>
    <a href="#" onclick="logout()"><span>🚪</span>Logout</a>
  </div>

  <script>
    const token = localStorage.getItem("token");
    if (!token) window.location.href = "/login";

    function authHeaders(json = true) {
      const h = { "Authorization": "Bearer " + token };
      if (json) h["Content-Type"] = "application/json";
      return h;
    }

    function showTab(name) {
      document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      document.getElementById(name).classList.add("active");
      event.target.classList.add("active");

      // Real-time chat: start polling only when Chat tab is open
      if (name === "chat") {
        startChatPolling();
      } else {
        stopChatPolling();
      }

      if (name === "compare") loadCompareOptions();
      if (name === "graphs") loadGraphs();
      if (name === "map") initMap();
    }

    async function loadUser() {
      const res = await fetch("/me", { headers: authHeaders() });
      if (!res.ok) { logout(); return; }
      const u = await res.json();
      document.getElementById("username").textContent = u.username.toUpperCase();
    }

    // ---------- GALLERY ----------
    async function loadGallery() {
      const grid = document.getElementById("galleryGrid");
      try {
        const res = await fetch("/api/files?all_users=true", { headers: authHeaders() });
        const files = await res.json();
        if (!files.length) {
          grid.innerHTML = `<div class="empty">No media yet</div>`;
          return;
        }
        grid.innerHTML = files.map(f => {
          const isVideo = f.content_type.startsWith("video/");
          const media = isVideo
            ? `<video src="${f.url}" muted controls></video>`
            : `<img src="${f.url}" loading="lazy">`;
          const tag = f.detected ? `<span class="tag">${f.detected}</span>` : "";
          return `<div class="card">${media}<div class="card-body">${tag}<div>${f.original_name}</div></div></div>`;
        }).join("");
      } catch (e) {
        grid.innerHTML = `<div class="empty">Error loading</div>`;
      }
    }

    async function doSync() {
      const s = document.getElementById("status");
      s.textContent = "Syncing…";
      const res = await fetch("/api/sync", { method: "POST", headers: authHeaders() });
      const data = await res.json();
      s.textContent = data.message || "Done";
      loadGallery();
      setTimeout(() => s.textContent = "", 2500);
    }

    async function doUpload(files) {
      if (!files.length) return;
      const s = document.getElementById("status");
      s.textContent = "Uploading…";
      const form = new FormData();
      Array.from(files).forEach(f => form.append("files", f));
      const res = await fetch("/upload", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token },
        body: form
      });
      s.textContent = res.ok ? "Upload complete" : "Upload failed";
      loadGallery();
      setTimeout(() => s.textContent = "", 2500);
    }

    // ---------- CHAT (with real-time updates) ----------
    let chatInterval = null;
    let lastMessageCount = 0;

    async function loadChat(silent = false) {
      const box = document.getElementById("chatBox");
      try {
        const res = await fetch("/chat", { headers: authHeaders() });
        if (!res.ok) return;
        const msgs = await res.json();
        const me = localStorage.getItem("username");

        // Only re-render if something changed (or first load)
        if (msgs.length !== lastMessageCount || !silent) {
          lastMessageCount = msgs.length;
          const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

          box.innerHTML = msgs.map(m => {
            const cls = m.sender_name === me ? "me" : "other";
            const time = new Date(m.created_at).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
            return `<div class="msg ${cls}"><div class="who">${m.sender_name}</div>${m.content}<div class="time">${time}</div></div>`;
          }).join("");

          // Keep scrolled to bottom if user was already at bottom
          if (wasAtBottom || !silent) {
            box.scrollTop = box.scrollHeight;
          }
        }
      } catch (e) {
        console.error("Chat load error", e);
      }
    }

    function startChatPolling() {
      stopChatPolling();
      loadChat();                         // immediate load
      chatInterval = setInterval(() => {
        loadChat(true);                   // silent poll every 3 seconds
      }, 3000);
    }

    function stopChatPolling() {
      if (chatInterval) {
        clearInterval(chatInterval);
        chatInterval = null;
      }
    }

    async function sendChat() {
      const input = document.getElementById("chatMsg");
      const content = input.value.trim();
      if (!content) return;

      input.value = "";
      input.focus();

      try {
        await fetch("/chat", {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify({ content })
        });
        // Force refresh right after sending
        lastMessageCount = 0;
        await loadChat();
      } catch (e) {
        document.getElementById("status").textContent = "Failed to send";
        setTimeout(() => document.getElementById("status").textContent = "", 2000);
      }
    }

    // ---------- COMPARE ----------
    let allFiles = [];
    async function loadCompareOptions() {
      const res = await fetch("/api/files?all_users=true", { headers: authHeaders() });
      allFiles = await res.json();
      const opts = allFiles.map(f => `<option value="${f.id}">${f.original_name} ${f.detected ? "("+f.detected+")" : ""}</option>`).join("");
      document.getElementById("cmpLeft").innerHTML = opts;
      document.getElementById("cmpRight").innerHTML = opts;
    }

    async function runCompare() {
      const id1 = document.getElementById("cmpLeft").value;
      const id2 = document.getElementById("cmpRight").value;
      if (!id1 || !id2) return;
      const res = await fetch(`/compare?id1=${id1}&id2=${id2}`, { headers: authHeaders() });
      const data = await res.json();
      const left = data.left;
      const right = data.right;
      document.getElementById("compareResult").innerHTML = `
        <div>
          <img src="${left.url}" alt="left">
          <div style="font-size:0.75rem;margin-top:4px;">${left.original_name}<br>${left.detected || ""}</div>
        </div>
        <div>
          <img src="${right.url}" alt="right">
          <div style="font-size:0.75rem;margin-top:4px;">${right.original_name}<br>${right.detected || ""}</div>
        </div>
      `;
    }

    // ---------- GRAPHS ----------
    let charts = {};
    async function loadGraphs() {
      const [act, sp, us] = await Promise.all([
        fetch("/stats/activity", { headers: authHeaders() }).then(r => r.json()),
        fetch("/stats/species", { headers: authHeaders() }).then(r => r.json()),
        fetch("/stats/by-user", { headers: authHeaders() }).then(r => r.json()),
      ]);

      if (charts.activity) charts.activity.destroy();
      charts.activity = new Chart(document.getElementById("activityChart"), {
        type: "line",
        data: {
          labels: act.map(a => a.date),
          datasets: [{ label: "Uploads", data: act.map(a => a.count), borderColor: "#39FF14", tension: 0.3 }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#888" } }, y: { ticks: { color: "#888" } } }
      });

      if (charts.species) charts.species.destroy();
      charts.species = new Chart(document.getElementById("speciesChart"), {
        type: "doughnut",
        data: {
          labels: sp.map(s => s.species),
          datasets: [{ data: sp.map(s => s.count), backgroundColor: ["#39FF14","#00ffff","#ff3333","#f1c40f","#9b59b6","#3498db"] }]
        },
        options: { plugins: { legend: { labels: { color: "#ccc" } } } }
      });

      if (charts.user) charts.user.destroy();
      charts.user = new Chart(document.getElementById("userChart"), {
        type: "bar",
        data: {
          labels: us.map(u => u.user),
          datasets: [{ label: "Files", data: us.map(u => u.count), backgroundColor: "#39FF14" }]
        },
        options: { plugins: { legend: { display: false } }, scales: { x: { ticks: { color: "#888" } }, y: { ticks: { color: "#888" } } }
      });
    }

    // ---------- MAP / SATELLITE ----------
    let map, mapReady = false;
    async function initMap() {
      if (mapReady) { loadLocations(); return; }
      map = L.map("map").setView([45.0, -63.0], 7); // default Nova Scotia-ish
      // Satellite-style tiles (Esri World Imagery)
      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
        attribution: "Esri, Maxar"
      }).addTo(map);
      mapReady = true;
      loadLocations();
    }

    async function loadLocations() {
      const res = await fetch("/locations", { headers: authHeaders() });
      const locs = await res.json();
      locs.forEach(l => {
        L.marker([l.latitude, l.longitude])
          .addTo(map)
          .bindPopup(`<b>${l.name}</b><br>${l.description || ""}`);
      });
    }

    async function addLocation() {
      const name = document.getElementById("locName").value.trim();
      const lat = parseFloat(document.getElementById("locLat").value);
      const lng = parseFloat(document.getElementById("locLng").value);
      const description = document.getElementById("locDesc").value.trim();
      if (!name || isNaN(lat) || isNaN(lng)) {
        document.getElementById("status").textContent = "Name, lat, lng required";
        return;
      }
      await fetch("/locations", {
        method: "POST",
        headers: authHeaders(),
        body: JSON.stringify({ name, latitude: lat, longitude: lng, description })
      });
      document.getElementById("status").textContent = "Location added";
      loadLocations();
      setTimeout(() => document.getElementById("status").textContent = "", 2000);
    }

    function logout() {
      localStorage.removeItem("token");
      localStorage.removeItem("username");
      window.location.href = "/login";
    }

    // Boot
    loadUser();
    loadGallery();
  </script>
</body>
</html>
