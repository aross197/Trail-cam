<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREA 51 TACTICAL • CAMERA LINK</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0d1117; 
            color: #c9d1d9; 
            text-align: center; 
            padding: 20px;
            margin: 0;
        }
        h1 { 
            color: #3fb950; 
            font-family: monospace; 
            font-size: 26px; 
            margin-bottom: 2px;
        }
        .sub { 
            color: #8b949e; 
            font-size: 11px; 
            letter-spacing: 2px; 
            margin-bottom: 20px; 
        }
        .card { 
            background: #161b22; 
            border-radius: 12px; 
            padding: 20px; 
            max-width: 420px; 
            margin: 0 auto; 
            border: 1px solid #30363d; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        .step-box {
            background: #0d1117;
            border-left: 4px solid #238636;
            text-align: left;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            line-height: 1.5;
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            color: #58a6ff; 
            font-weight: 600; 
            font-size: 14px;
        }
        input[type="text"] { 
            width: 100%; 
            padding: 12px; 
            border-radius: 8px; 
            border: 1px solid #30363d; 
            background: #0d1117; 
            color: #3fb950; 
            font-family: monospace;
            font-size: 18px; 
            text-align: center; 
            margin-bottom: 15px; 
            outline: none;
        }
        .btn-main { 
            display: block; 
            width: 100%; 
            background: #238636; 
            color: #ffffff; 
            border: none; 
            padding: 16px 0; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            text-decoration: none; 
        }
        .btn-main:active { background: #2ea043; }
        .preset-title {
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .btn-sub {
            background: #21262d;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 10px 0;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-sub:active { background: #30363d; }
    </style>
</head>
<body>

    <h1>AREA 51 TACTICAL</h1>
    <div class="sub">UNIVERSAL TRAILCAM LINK</div>

    <div class="card">
        
        <div class="step-box">
            <strong>Quick Start:</strong><br>
            1. Connect phone Wi-Fi to <i>TrailCam_XXXX</i><br>
            2. Tap <b>CONNECT TO CAMERA LOGIN</b> below.
        </div>

        <label for="cameraIp">Active Camera Target IP:</label>
        <input type="text" id="cameraIp" value="192.168.1.1" placeholder="192.168.1.1">

        <!-- Primary Launch Button -->
        <button class="btn-main" onclick="openLogin()">CONNECT TO CAMERA LOGIN</button>

        <div class="preset-title">Alternate Model IPs (If Default Fails):</div>
        <div class="preset-grid">
            <button class="btn-sub" onclick="setAndLaunch('192.168.1.1')">192.168.1.1</button>
            <button class="btn-sub" onclick="setAndLaunch('192.168.8.1')">192.168.8.1</button>
            <button class="btn-sub" onclick="setAndLaunch('192.168.43.1')">192.168.43.1</button>
        </div>

    </div>

    <script>
        function getTargetIp() {
            let rawIp = document.getElementById('cameraIp').value.trim();
            let cleanIp = rawIp.replace(/^https?:\/\//, '').replace(/\/.*$/, '');
            return cleanIp || '192.168.1.1';
        }

        function openLogin() {
            const ip = getTargetIp();
            // Forces immediate browser tab transition to the local camera HTTP web server
            window.location.href = `http://${ip}/`;
        }

        function setAndLaunch(ip) {
            document.getElementById('cameraIp').value = ip;
            window.location.href = `http://${ip}/`;
        }
    </script>

</body>
</html>
